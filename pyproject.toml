[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "review-vector-pipeline"
version = "0.1.0"
description = "Chunk cleaned CSV reviews, embed them, and persist them in ChromaDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "python-dotenv>=1.0,<2.0",
    "chromadb",
    "sentence-transformers",
    "groq",
]

[project.scripts]
review-ingest = "review_vector_pipeline.cli:main"
review-query = "review_vector_pipeline.query_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

